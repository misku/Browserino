name: Release

# Pushing a version tag, such as v2.0.0, builds the app the same way CI does
# and publishes it as a zip on a GitHub Release, so the README can link to a
# download instead of only to build instructions.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build unsigned release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Browserino.xcodeproj \
            -target Browserino \
            -configuration Release \
            -sdk macosx \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signed only: macOS asks the user to confirm the first launch,
      # which the README explains.
      - name: Sign and zip the app
        run: |
          APP_PATH="$RUNNER_TEMP/Build/Browserino.app"
          codesign --force --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Browserino-$GITHUB_REF_NAME.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/Browserino-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Browserino $GITHUB_REF_NAME" \
            --generate-notes
